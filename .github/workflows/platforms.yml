name: Platforms (A23 test)

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  budget:
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-latest, ubuntu-24.04-arm, macos-26-intel, macos-latest, windows-latest, windows-11-arm ]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      # soroban-budget-action's main after A23 (#40), pinned by commit.
      - uses: BudgetGate/soroban-budget-action@b842a4ee1a7b3b90ee100900f24c0b23bad5c2a1
        with:
          fixture-path: budget/fixture.json
          binary-version: 0.2.2
