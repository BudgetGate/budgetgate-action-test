name: Platforms (A23 test)

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  budget:
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-latest, ubuntu-24.04-arm, macos-26-intel, macos-latest, windows-latest, windows-11-arm ]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      # soroban-budget-action's fix/windows-baseline-cache (A24), pinned by commit.
      - uses: BudgetGate/soroban-budget-action@7fe7e6e26c167e96d719ee4ddfbf297362f760ed
        with:
          fixture-path: budget/fixture.json
          binary-version: 0.2.2
