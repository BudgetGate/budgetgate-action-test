name: Platforms (A23 test)

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  budget:
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest ]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      # soroban-budget-action's feat/more-runner-platforms (A23), pinned by commit.
      - uses: BudgetGate/soroban-budget-action@243aa87ab1d79a75956393484c0c639b495a2408
        with:
          fixture-path: budget/fixture.json
          binary-version: 0.2.1
