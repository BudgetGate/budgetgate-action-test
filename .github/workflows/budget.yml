name: Budget Gate

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # main after the A21 dependency upgrade (soroban-budget-action #32), pinned by commit.
      - uses: BudgetGate/soroban-budget-action@909e535a1d508a34017f012b36d74e08cdc9bf48
        with:
          fixture-path: budget/fixture.json
          binary-version: 0.2.0
          history-branch: budgetgate-history
