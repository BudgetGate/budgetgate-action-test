name: Budget Gate

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Action's v0.2.1 release.
      - uses: BudgetGate/soroban-budget-action@v0.2.1
        with:
          fixture-path: budget/fixture.json
          binary-version: 0.2.1
          history-branch: budgetgate-history
