name: Budget Gate

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Action's main (#24 merged); switch to the release tag once the Action is released.
      - uses: BudgetGate/soroban-budget-action@main
        with:
          fixture-path: budget/fixture.json
          binary-version: 0.2.0
          history-branch: budgetgate-history
