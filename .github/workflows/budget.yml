name: Budget Gate

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # main after A22 (soroban-budget-action #34), pinned by commit until the Action's v0.2.1 release.
      - uses: BudgetGate/soroban-budget-action@aaba24a8f78968c950267a602400722b0526febe
        with:
          fixture-path: budget/fixture.json
          binary-version: 0.2.1
          history-branch: budgetgate-history
